name: Release

# Push a tag like v0.2.0 to publish a GitHub release (which HACS shows as the version).
# The tag must match "version" in custom_components/hsveitur/manifest.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest=$(python3 -c 'import json; print(json.load(open("custom_components/hsveitur/manifest.json"))["version"])')
          if [ "$TAG" != "v$manifest" ]; then
            echo "::error::Tag $TAG does not match manifest version v$manifest"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
